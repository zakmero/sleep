<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=/?p=/landing" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0c0f;
      color: #e5e7eb;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    a { color: #fb923c; }
  </style>
  <script>
    (function () {
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      window.location.replace('/?p=/landing' + (query ? '&q=' + encodeURIComponent(query.slice(1)) : '') + hash);
    })();
  </script>
</head>
<body>
  <p>Opening landing page... If not redirected, <a href="/?p=/landing">tap here</a>.</p>
</body>
</html>
